<template>
  <section aria-labelledby="report-title">
    <div class="heading"><div><h1 id="report-title">Integration Reporting</h1><p>Subscription and runtime usage across Quickbridge products.</p></div><lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh reporting" onclick={refresh}></lightning-button-icon></div>
    <template lwc:if={loading}><div class="state"><lightning-spinner alternative-text="Loading reporting"></lightning-spinner></div></template>
    <template lwc:if={errorMessage}><div class="alert" role="alert">{errorMessage}</div></template>
    <template lwc:if={hasProducts}>
      <div class="products">
        <template for:each={products} for:item="product">
          <article class="product" key={product.connectorKey}>
            <div class="product-head"><div><h2>{product.label}</h2><span>{product.subscriptionLabel}</span></div><template lwc:if={product.expiryDate}><div class="expiry"><strong>{product.daysRemaining}</strong><span>days remaining</span></div></template></div>
            <div class="metrics">
              <div><span>Synced Records</span><strong>{product.syncedRecords}</strong><lightning-progress-bar value={product.syncedPercent} size="large"></lightning-progress-bar><small>Limit {product.syncedRecordLimit}</small></div>
              <div><span>Errors</span><strong>{product.errors}</strong><lightning-progress-bar value={product.errorPercent} variant="circular" size="large"></lightning-progress-bar><small>Limit {product.errorLimit}</small></div>
              <div><span>Endpoint Usage</span><strong>{product.endpointUsage}</strong><lightning-progress-bar value={product.endpointPercent} size="large"></lightning-progress-bar><small>Limit {product.endpointLimit}</small></div>
              <div><span>Subscription</span><strong>{product.subscriptionLabel}</strong><small><lightning-formatted-date-time value={product.lastUpdatedLabel}></lightning-formatted-date-time></small></div>
            </div>
          </article>
        </template>
      </div>
    </template>
    <template lwc:else><template lwc:if={loading}></template><template lwc:else><div class="empty"><lightning-icon icon-name="utility:chart" size="small"></lightning-icon><h2>No reporting data</h2><p>No enabled connector matches this view.</p></div></template></template>
  </section>
</template>
