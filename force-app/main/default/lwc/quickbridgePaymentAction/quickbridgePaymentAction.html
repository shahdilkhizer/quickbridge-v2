<template>
  <lightning-quick-action-panel header="Quickbridge Payment">
    <template lwc:if={loading}><lightning-spinner alternative-text="Loading payment providers"></lightning-spinner></template>
    <template lwc:if={message}><div class={messageClass} role="status">{message}</div></template>
    <lightning-combobox label="Payment provider" value={provider} options={providers} onchange={handleProvider}></lightning-combobox>
    <p class="slds-text-body_small slds-text-color_weak slds-m-top_medium">Amount, currency, reference, and customer details come from the saved mapping for this record. Payment details are collected only on the provider's hosted page.</p>
    <div slot="footer">
      <lightning-button label="Cancel" onclick={close}></lightning-button>
      <lightning-button class="slds-m-left_small" variant="brand" label="Create hosted payment" onclick={initialize} disabled={disabled}></lightning-button>
    </div>
  </lightning-quick-action-panel>
</template>
